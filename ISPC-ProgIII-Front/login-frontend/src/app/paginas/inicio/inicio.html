
<header class="hero-section d-flex align-items-center">
  <div class="container text-center">
    <div class="hero-content p-5 rounded-4 shadow-sm">
      <h1 class="display-4 fw-bold">Bienvenido a StyleShop</h1>
      <p class="lead">Descubre las últimas tendencias con el mejor estilo.</p>
      <a routerLink="/shop" class="btn btn-primary btn-lg px-4">Explorar Tienda</a>
    </div>
  </div>
</header>

<main class="container section">
  <h2 class="section-title">Productos Destacados</h2>

  <div class="products-grid">

    <div class="product-item">
      <div class="product-card-glass">
        <img src="/image.png" alt="Camiseta" class="product-img">
        <div class="card-body">
          <h3>Camiseta Style</h3>
          <p class="text-muted">Calidad premium para tu outfit.</p>
          <div class="card-footer-custom">
            <span class="price-tag">$25.00</span>
            <button class="btn-primary" (click)="agregarAlCarrito('Camiseta Style', 25)">
              Añadir
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="product-item">
      <div class="product-card-glass">
        <img src="/pantalon.png" alt="Pantalón" class="product-img">
        <div class="card-body">
          <h3>Pantalón Urbano</h3>
          <p class="text-muted">Comodidad y diseño en uno solo.</p>
          <div class="card-footer-custom">
            <span class="price-tag">$45.00</span>
            <button class="btn-primary" (click)="agregarAlCarrito('Pantalón Urbano', 45)">
              Añadir
            </button>

          </div>
        </div>
      </div>
    </div>

    <div class="product-item">
      <div class="product-card-glass">
        <img src="Z.png" alt="Gorra" class="product-img">
        <div class="card-body">
          <h3>Gorra Limited</h3>
          <p class="text-muted">El accesorio que te faltaba.</p>
          <div class="card-footer-custom">
            <span class="price-tag">$15.00</span>
            <button class="btn-primary" (click)="agregarAlCarrito('Gorra Limited', 15)">
              Añadir
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>
</main>
